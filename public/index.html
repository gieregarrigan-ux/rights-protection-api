<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>维权话术生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .loading-dots::after {
            content: '...';
            animation: pulse 1.5s infinite;
        }
        .result-box {
            white-space: pre-wrap;
            line-height: 1.8;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-blue-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">⚖️ 维权话术生成器</h1>
            <p class="text-gray-600">AI 智能生成专业维权话术，三种版本任选</p>
        </div>

        <div class="bg-white rounded-2xl shadow-lg p-6 mb-6">
            <label class="block text-gray-700 font-semibold mb-3">
                请描述你的维权诉求
            </label>
            <textarea 
                id="queryInput" 
                class="w-full h-32 p-4 border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none transition resize-none text-gray-700"
                placeholder="例如：我想退款，他们给我定的那个包月服务，我不需要，然后就莫名的被扣款了..."
            ></textarea>
            
            <div class="flex items-center justify-between mt-4">
                <span id="charCount" class="text-sm text-gray-400">0 / 500 字</span>
                <button 
                    id="generateBtn" 
                    class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-8 rounded-xl transition transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none"
                >
                    🚀 生成维权话术
                </button>
            </div>
        </div>

        <div id="resultContainer" class="hidden">
            <div class="bg-white rounded-2xl shadow-lg p-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-bold text-gray-800">📄 生成结果</h2>
                    <button 
                        id="copyBtn" 
                        class="text-blue-600 hover:text-blue-800 font-medium flex items-center gap-2 transition"
                    >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                        </svg>
                        一键复制
                    </button>
                </div>
                <div id="resultContent" class="result-box bg-gray-50 rounded-xl p-5 text-gray-700 min-h-[200px]"></div>
            </div>
        </div>

        <div id="loadingContainer" class="hidden">
            <div class="bg-white rounded-2xl shadow-lg p-8 text-center">
                <div class="text-4xl mb-4">🤖</div>
                <p class="text-gray-600 font-medium loading-dots">AI 正在生成专业维权话术</p>
            </div>
        </div>

        <div id="errorContainer" class="hidden">
            <div class="bg-red-50 border-2 border-red-200 rounded-2xl p-6 text-center">
                <div class="text-4xl mb-4">❌</div>
                <p id="errorMessage" class="text-red-600 font-medium"></p>
            </div>
        </div>

        <div class="text-center mt-8 text-gray-400 text-sm">
            <p>💡 提示：话术仅供参考，实际维权时请根据具体情况调整</p>
        </div>
    </div>

    <script>
        const queryInput = document.getElementById('queryInput');
        const charCount = document.getElementById('charCount');
        const generateBtn = document.getElementById('generateBtn');
        const resultContainer = document.getElementById('resultContainer');
        const resultContent = document.getElementById('resultContent');
        const loadingContainer = document.getElementById('loadingContainer');
        const errorContainer = document.getElementById('errorContainer');
        const errorMessage = document.getElementById('errorMessage');
        const copyBtn = document.getElementById('copyBtn');

        queryInput.addEventListener('input', () => {
            const len = queryInput.value.length;
            charCount.textContent = `${len} / 500 字`;
            charCount.className = len > 500 ? 'text-sm text-red-500' : 'text-sm text-gray-400';
        });

        function showLoading() {
            loadingContainer.classList.remove('hidden');
            resultContainer.classList.add('hidden');
            errorContainer.classList.add('hidden');
            generateBtn.disabled = true;
            generateBtn.textContent = '⏳ 生成中...';
        }

        function showResult() {
            loadingContainer.classList.add('hidden');
            resultContainer.classList.remove('hidden');
            errorContainer.classList.add('hidden');
            generateBtn.disabled = false;
            generateBtn.textContent = '🚀 生成维权话术';
        }

        function showError(message) {
            loadingContainer.classList.add('hidden');
            resultContainer.classList.add('hidden');
            errorContainer.classList.remove('hidden');
            errorMessage.textContent = message;
            generateBtn.disabled = false;
            generateBtn.textContent = '🚀 生成维权话术';
        }

        function parseStreamChunk(chunk) {
            const lines = chunk.split('\n');
            let text = '';
            for (const line of lines) {
                if (line.startsWith('data:')) {
                    try {
                        const data = JSON.parse(line.slice(5));
                        if (data.content && data.content.answer) {
                            text += data.content.answer;
                        }
                    } catch (e) {}
                }
            }
            return text;
        }

        generateBtn.addEventListener('click', async () => {
            const query = queryInput.value.trim();
            if (!query) {
                showError('请输入维权诉求内容');
                return;
            }
            if (query.length > 500) {
                showError('诉求内容过长，请控制在500字以内');
                return;
            }
            showLoading();
            resultContent.textContent = '';

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `请求失败 (${response.status})`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value);
                    const newText = parseStreamChunk(chunk);
                    if (newText) {
                        resultContent.textContent += newText;
                        resultContent.scrollTop = resultContent.scrollHeight;
                    }
                }
                showResult();
            } catch (error) {
                console.error('生成失败:', error);
                showError(error.message || '生成失败，请稍后重试');
            }
        });

        copyBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(resultContent.textContent);
                const originalText = copyBtn.innerHTML;
                copyBtn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> 已复制！';
                setTimeout(() => { copyBtn.innerHTML = originalText; }, 2000);
            } catch (err) {
                alert('复制失败，请手动复制');
            }
        });

        queryInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                generateBtn.click();
            }
        });
    </script>
</body>
</html>
